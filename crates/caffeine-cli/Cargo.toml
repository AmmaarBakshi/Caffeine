[package]
name = "caffeine-cli"
description = "Caffeine: a terminal-only, cross-platform utility that keeps your computer awake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["caffeine", "sleep", "power", "inhibit", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "caffeine"
path = "src/main.rs"

[dependencies]
caffeine-core.workspace = true
caffeine-platform.workspace = true
caffeine-plugin-api.workspace = true
caffeine-plugin-build.workspace = true
caffeine-plugin-manager.workspace = true
caffeine-tui.workspace = true
clap.workspace = true
clap_complete.workspace = true
ctrlc.workspace = true
log.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
